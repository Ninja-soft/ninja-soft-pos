name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # Valores dummy: el build no se conecta a Supabase, solo necesita que las
      # variables existan. Los reales viven en Vercel.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      APP_ENV: preview
    steps:
      - uses: actions/checkout@v4

      # Versión de pnpm tomada de "packageManager" en package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Suite de aislamiento multi-tenant + RLS (F1.5) contra un Supabase local
  # real con todas las migraciones aplicadas. Si esto falla, hay fuga entre
  # tenants o una policy rota: no mergear.
  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 22+: supabase-js v2.106 necesita WebSocket nativo (Node 20 no lo trae).
          node-version: 22
          cache: pnpm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start Supabase local (aplica migraciones)
        run: supabase start

      - name: RLS / aislamiento multi-tenant
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          export SUPABASE_TEST_URL="$API_URL"
          export SUPABASE_TEST_ANON_KEY="$ANON_KEY"
          export SUPABASE_TEST_SERVICE_KEY="$SERVICE_ROLE_KEY"
          pnpm test:rls
