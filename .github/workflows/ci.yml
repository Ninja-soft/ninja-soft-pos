name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # Valores dummy: el build no se conecta a Supabase, solo necesita que las
      # variables existan. Los reales viven en Vercel.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      APP_ENV: preview
    steps:
      - uses: actions/checkout@v4
        with:
          # Historia completa: deploy-check compara las migraciones con la rama base.
          fetch-depth: 0

      # Versión de pnpm tomada de "packageManager" en package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # La tabla de avance de docs/02-roadmap.md tiene que estar recalculada (OPS-13).
      - name: Roadmap progress
        run: node scripts/roadmap-progress.mjs --check

      - name: Typecheck
        # tsc del proyecto entero supera el heap por defecto de Node 20 (~2 GB)
        # en el runner: sin esto muere por OOM (SEC-03, 2026-11-16).
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm typecheck

      # Orden y nombres de migraciones, migraciones aplicadas sin tocar y lista
      # exacta de Edge Functions públicas (verify_jwt = false). ADR-098.
      - name: Deploy check
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            node scripts/deploy-check.mjs --base=origin/${{ github.base_ref }}
          else
            node scripts/deploy-check.mjs
          fi

      - name: Test
        run: pnpm test

      # Mismo heap que el typecheck: el chequeo de tipos de `next build` muere
      # por OOM con el default (~2 GB). `pnpm build` termina con
      # scripts/build-check.mjs, que falla si no quedó .next/BUILD_ID (en Linux
      # Next sale 0 cuando el worker de tipos muere por OOM; OPS-55).
      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm build

  # Suite de aislamiento multi-tenant + RLS (F1.5) contra un Supabase local
  # real con todas las migraciones aplicadas. Si esto falla, hay fuga entre
  # tenants o una policy rota: no mergear.
  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 22+: supabase-js v2.106 necesita WebSocket nativo (Node 20 no lo trae).
          node-version: 22
          cache: pnpm

      # Versión fijada (SEC-03): con `latest` cualquier release rompe la suite
      # de golpe. v3.0.0 (2026-11-02) ya no acepta `inbucket` en config.toml.
      # 2.122.0 es la del último CI verde de main (2026-10-27). Se libera
      # después de SEC-07 (grants explícitos, sin auto_expose_new_tables);
      # mientras tanto, ci-cli-canary.yml prueba `latest` cada semana.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start Supabase local (aplica migraciones)
        run: supabase start

      - name: RLS / aislamiento multi-tenant
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          export SUPABASE_TEST_URL="$API_URL"
          export SUPABASE_TEST_ANON_KEY="$ANON_KEY"
          export SUPABASE_TEST_SERVICE_KEY="$SERVICE_ROLE_KEY"
          # SEC-07: grants explícitos → la paridad con grants.expected.json es estricta.
          export GRANTS_PARITY_STRICT=1
          pnpm test:rls

  # Smoke E2E (OPS-15): build de producción + Playwright en "modo smoke" (sin
  # sesión: páginas públicas, /rest/v1 respondido vacío desde el navegador,
  # falla ante errores de consola). No requerido hasta OPS-04.
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Mismos dummy que `quality`: el smoke no habla con un Supabase real.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      APP_ENV: preview
      BASE_URL: http://localhost:3005
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # --with-deps instala las librerías del sistema aunque el browser venga del cache.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Mismo heap que el typecheck de `quality`: el chequeo de tipos de
      # `next build` muere por OOM con el default (~2 GB). El BUILD_ID lo valida
      # scripts/build-check.mjs, encadenado en el script `build` (OPS-55).
      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm build

      - name: Start app
        run: |
          pnpm start -p 3005 > next-start.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3005/api/health > /dev/null; then
              echo "app lista (${i}s)"; exit 0
            fi
            sleep 1
          done
          echo "la app no respondió /api/health en 60 s"; cat next-start.log; exit 1

      - name: E2E smoke
        run: pnpm test:e2e --project=chrome

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            next-start.log
          retention-days: 7
