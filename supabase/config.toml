# Config del stack local de Supabase (supabase start). Usado por dev local y
# por el job "rls" de CI para correr la suite de aislamiento multi-tenant.
# El proyecto remoto NO usa este archivo, salvo la sección [functions.*] del
# final (la lee `supabase functions deploy`).
project_id = "ninja-soft-pos"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
# Los privilegios del Data API (anon / authenticated / service_role) son
# explícitos en las migraciones (SEC-07, ADR-184): no se usa
# auto_expose_new_tables. Toda tabla nueva lleva sus grants en la migración que
# la crea; tests/integration/grants-parity.test.ts lo controla en CI.

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = false

[inbucket]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:8080"]
jwt_expiry = 3600
enable_signup = true
# Política de contraseña (SEC-22): misma regla que modules/auth/password.ts
# (mínimo 10, mayúscula + minúscula + número; docs/05-security.md §3). Valores
# válidos de password_requirements (CLI 2.122.0): "", "letters_digits",
# "lower_upper_letters_digits", "lower_upper_letters_digits_symbols".
# Prod se configura aparte en el dashboard de Auth (no hay `config push`).
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

# MFA TOTP del staff interno (SEC-23, ADR-186). Sólo local: en prod TOTP viene
# habilitado por defecto en Supabase Auth (Authentication › MFA).
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[analytics]
enabled = false

[edge_runtime]
enabled = false

# -----------------------------------------------------------------------------
# Edge Functions públicas (verify_jwt = false). ESTA SECCIÓN SÍ AFECTA EL
# DEPLOY REMOTO: `supabase functions deploy` lee verify_jwt de acá, así que un
# deploy de todas las funciones no deja a un webhook pidiendo JWT (el proveedor
# recibiría 401 y el cobro no se acreditaría). Cualquier otra Edge exige JWT.
# La lista tiene que coincidir con PUBLIC_FUNCTIONS de scripts/deploy-check.mjs
# (lo valida CI). Cada una valida por su cuenta: re-consulta al proveedor,
# `state` de un solo uso o token del link de pago. ADR-098.
# -----------------------------------------------------------------------------
[functions.catalog_purchase_webhook]
verify_jwt = false

[functions.clover_webhook]
verify_jwt = false

# Pedidos de apps de delivery (ADR-102): firma HMAC por adaptador.
[functions.delivery_channel_webhook]
verify_jwt = false

[functions.directo_webhook]
verify_jwt = false

[functions.getnet_checkout]
verify_jwt = false

[functions.getnet_webhook]
verify_jwt = false

[functions.gocuotas_webhook]
verify_jwt = false

[functions.ml_oauth_callback]
verify_jwt = false

[functions.ml_webhook]
verify_jwt = false

[functions.mobbex_webhook]
verify_jwt = false

[functions.modo_webhook]
verify_jwt = false

[functions.mp_billing_webhook]
verify_jwt = false

[functions.mp_oauth_callback]
verify_jwt = false

[functions.mp_token_broker]
verify_jwt = false

[functions.mp_orders_webhook]
verify_jwt = false

[functions.mp_webhook]
verify_jwt = false

[functions.nave_webhook]
verify_jwt = false

[functions.payway_checkout]
verify_jwt = false

[functions.payway_webhook]
verify_jwt = false

[functions.send_password_recovery]
verify_jwt = false

# Ualá Bis (ADR-143): webhook de órdenes y devoluciones + pantallas de retorno.
[functions.ualabis_webhook]
verify_jwt = false

# Viumi (ADR-173): webhook de pagos (sin firma; se re-consulta la orden).
[functions.viumi_webhook]
verify_jwt = false

# Talo (ADR-175): webhook de pagos por transferencia (sin firma: se re-consulta).
[functions.talo_webhook]
verify_jwt = false

# dLocal Go (ADR-180): notificaciones de pagos y devoluciones (firmadas con
# HMAC-SHA256; igual se re-consulta el pago).
[functions.dlocalgo_webhook]
verify_jwt = false

# -----------------------------------------------------------------------------
# Edge Functions con JWT declaradas explícitamente (no van en PUBLIC_FUNCTIONS).
# catalog_sync (ADR-106): la llama el cron con X-Cron-Secret (anon key como
# Bearer para pasar el gateway) o el staff interno con su JWT.
# -----------------------------------------------------------------------------
[functions.catalog_sync]
verify_jwt = true

# internal_impersonate (H11c, SEC-26): sólo staff interno con su JWT. Valida
# getUser() + is_internal adentro, pero el gateway también tiene que exigir JWT.
[functions.internal_impersonate]
verify_jwt = true
